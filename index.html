<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Project - Responsive Design</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1 id="top">Bộ sưu tập màu sắc yêu thích</h1>
    </header>
    
    <main>
        <p>Trang web này giới thiệu bộ sưu tập các màu sắc rực rỡ và ý nghĩa của chúng trong thiết kế đồ họa cũng như cuộc sống hàng ngày.</p>
        <p>Mỗi màu sắc mang một cảm xúc và phong cách riêng, giúp không gian số trở nên sinh động và thu hút hơn đối với người xem.</p>
        
        <div class="grid">
            <figure>
                <img src="images/Red.jpeg" alt="Màu đỏ rực rỡ" width="200">
                <figcaption>Màu Đỏ</figcaption>
            </figure>
            <figure>
                <img src="images/Orange.png" alt="Màu cam tươi tắn" width="200">
                <figcaption>Màu Cam</figcaption>
            </figure>
            <figure>
                <img src="images/Yellow.png" alt="Màu vàng ấm áp" width="200">
                <figcaption>Màu Vàng</figcaption>
            </figure>
            <figure>
                <img src="images/Blue.png" alt="Màu xanh dương dịu mát" width="200">
                <figcaption>Màu Xanh Dương</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
